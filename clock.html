<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-light: #60a5fa;
            --bg-dark: #0b0f1a;
            --bg-darker: #020617;
            --bg-card: #111827;
            --text-light: #cbd5e1;
            --text-lighter: #94a3b8;
            --accent: #10b981;
            --accent-dark: #059669;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-darker) 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        /* HEADER */
        header {
            text-align: center;
            margin-bottom: 50px;
            padding-top: 20px;
        }

        header h1 {
            font-size: 42px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            color: var(--text-light);
            font-size: 16px;
        }

        /* MAIN CONTAINER */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* CONTROLS */
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .format-toggle {
            display: flex;
            gap: 10px;
            background: var(--bg-card);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .toggle-btn {
            padding: 10px 20px;
            border: none;
            background: transparent;
            color: var(--text-light);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s;
            font-weight: 600;
        }

        .toggle-btn.active {
            background: var(--primary);
            color: white;
        }

        .toggle-btn:hover {
            color: var(--primary);
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-box input {
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            background: var(--bg-card);
            color: white;
            font-size: 14px;
            transition: all 0.3s;
            width: 250px;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.1);
        }

        .search-box input::placeholder {
            color: var(--text-lighter);
        }

        /* CLOCKS GRID */
        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        /* CLOCK CARD */
        .clock-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 40px 30px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            transition: all 0.3s;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .clock-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: 0 20px 50px rgba(59, 130, 246, 0.2);
        }

        .clock-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .clock-icon {
            font-size: 28px;
            color: var(--primary);
        }

        .clock-timezone {
            font-size: 24px;
            font-weight: 700;
            color: white;
        }

        .clock-location {
            font-size: 13px;
            color: var(--text-lighter);
            margin-top: 5px;
        }

        /* DIGITAL CLOCK DISPLAY */
        .digital-clock {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(16, 185, 129, 0.1));
            border-radius: 12px;
            padding: 25px 20px;
            margin: 25px 0;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .time-display {
            font-size: 48px;
            font-weight: 800;
            font-family: 'Courier New', monospace;
            color: var(--primary-light);
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(96, 165, 250, 0.3);
            margin-bottom: 10px;
        }

        .date-display {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 8px;
        }

        .day-display {
            font-size: 13px;
            color: var(--text-lighter);
        }

        /* ANALOG CLOCK */
        .analog-clock-container {
            display: flex;
            justify-content: center;
            margin: 30px 0;
        }

        .analog-clock {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.1);
            border: 3px solid var(--primary);
            position: relative;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.2), inset 0 0 30px rgba(59, 130, 246, 0.1);
        }

        .clock-center {
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            background: var(--primary);
            border-radius: 10px;
        }

        .hour-hand {
            width: 6px;
            height: 50px;
            margin-left: -3px;
            background: var(--primary-light);
        }

        .minute-hand {
            width: 4px;
            height: 65px;
            margin-left: -2px;
            background: var(--primary);
        }

        .second-hand {
            width: 2px;
            height: 70px;
            margin-left: -1px;
            background: var(--accent);
        }

        .clock-number {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-light);
        }

        .clock-number span {
            display: inline-block;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
        }

        /* STATS */
        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 50px;
            padding: 30px;
            background: var(--bg-card);
            border-radius: 15px;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .stat-box {
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-lighter);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* BUTTONS */
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 14px;
            margin-top: 20px;
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }

        .btn-danger {
            background: var(--danger);
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-lighter);
            border-top: 1px solid rgba(59, 130, 246, 0.2);
            margin-top: 50px;
            font-size: 14px;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            header h1 {
                font-size: 28px;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
            }

            .time-display {
                font-size: 36px;
            }

            .search-box input {
                width: 100%;
            }

            .controls {
                flex-direction: column;
            }

            .stats-section {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* ANIMATIONS */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .time-display {
            animation: pulse 1s ease-in-out infinite;
        }

        /* LOADING */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-lighter);
        }

        .empty-state i {
            font-size: 60px;
            color: var(--primary);
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 16px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <header>
        <h1><i class="fas fa-clock"></i> Digital Clock</h1>
        <p>View current time across multiple time zones worldwide</p>
    </header>

    <div class="container">
        <!-- CONTROLS -->
        <div class="controls">
            <div class="format-toggle">
                <button class="toggle-btn active" onclick="toggleFormat('digital')">
                    <i class="fas fa-digital-tachograph"></i> Digital
                </button>
                <button class="toggle-btn" onclick="toggleFormat('analog')">
                    <i class="fas fa-circle-notch"></i> Analog
                </button>
                <button class="toggle-btn" onclick="toggleFormat('both')">
                    <i class="fas fa-th"></i> Both
                </button>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search timezone...">
                <button class="btn" onclick="searchTimezone()">
                    <i class="fas fa-search"></i> Search
                </button>
            </div>
        </div>

        <!-- CLOCKS GRID -->
        <div class="clocks-grid" id="clocksGrid">
            <!-- Clocks will be generated here -->
        </div>

        <!-- STATS -->
        <div class="stats-section">
            <div class="stat-box">
                <div class="stat-number" id="totalClocks">0</div>
                <div class="stat-label">Active Timezones</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="timeUpdate">00:00</div>
                <div class="stat-label">Last Update</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="maxDifference">+12h</div>
                <div class="stat-label">Max Time Difference</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="fastestZone">UTC</div>
                <div class="stat-label">Fastest Zone</div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Digital Clock App | Real-time timezone converter | Built with ❤️</p>
    </footer>

    <script>
        // List of timezones
        const timezones = [
            { name: 'New York', timezone: 'America/New_York', icon: '🗽' },
            { name: 'London', timezone: 'Europe/London', icon: '🇬🇧' },
            { name: 'Paris', timezone: 'Europe/Paris', icon: '🗼' },
            { name: 'Dubai', timezone: 'Asia/Dubai', icon: '🏜️' },
            { name: 'Tokyo', timezone: 'Asia/Tokyo', icon: '🗾' },
            { name: 'Sydney', timezone: 'Australia/Sydney', icon: '🦘' },
            { name: 'Singapore', timezone: 'Asia/Singapore', icon: '🇸🇬' },
            { name: 'Hong Kong', timezone: 'Asia/Hong_Kong', icon: '🏮' },
            { name: 'Toronto', timezone: 'America/Toronto', icon: '🍁' },
            { name: 'São Paulo', timezone: 'America/Sao_Paulo', icon: '🇧🇷' },
            { name: 'Moscow', timezone: 'Europe/Moscow', icon: '🇷🇺' },
            { name: 'Mumbai', timezone: 'Asia/Kolkata', icon: '🇮🇳' },
            { name: 'Bangkok', timezone: 'Asia/Bangkok', icon: '🇹🇭' },
            { name: 'Dubai', timezone: 'Asia/Dubai', icon: '🌆' },
            { name: 'Berlin', timezone: 'Europe/Berlin', icon: '🇩🇪' },
        ];

        let currentFormat = 'digital';
        let filteredTimezones = [...timezones];

        // Initialize
        function init() {
            renderClocks();
            updateStats();
            setInterval(() => {
                updateAllClocks();
                updateStats();
            }, 1000);
        }

        // Render clocks
        function renderClocks() {
            const grid = document.getElementById('clocksGrid');
            grid.innerHTML = '';

            if (filteredTimezones.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <i class="fas fa-search"></i>
                        <p>No timezones found</p>
                        <button class="btn" onclick="resetSearch()">Reset Search</button>
                    </div>
                `;
                return;
            }

            filteredTimezones.forEach((tz, index) => {
                const card = document.createElement('div');
                card.className = 'clock-card';
                card.id = `clock-${index}`;
                card.innerHTML = `
                    <div class="clock-header">
                        <span class="clock-icon">${tz.icon}</span>
                        <div>
                            <div class="clock-timezone">${tz.name}</div>
                            <div class="clock-location">${tz.timezone}</div>
                        </div>
                    </div>

                    <div class="digital-clock" id="digital-${index}">
                        <div class="time-display" id="time-${index}">--:--:--</div>
                        <div class="date-display" id="date-${index}">--/--/----</div>
                        <div class="day-display" id="day-${index}">---</div>
                    </div>

                    <div class="analog-clock-container" id="analog-container-${index}" style="display: none;">
                        <div class="analog-clock">
                            <div class="clock-center"></div>
                            <div class="hand hour-hand" id="hour-${index}"></div>
                            <div class="hand minute-hand" id="minute-${index}"></div>
                            <div class="hand second-hand" id="second-${index}"></div>
                            <div class="clock-number">
                                <span style="transform: rotate(0deg) translateY(-80px);">12</span>
                                <span style="transform: rotate(90deg) translateY(-80px);">3</span>
                                <span style="transform: rotate(180deg) translateY(-80px);">6</span>
                                <span style="transform: rotate(270deg) translateY(-80px);">9</span>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            updateAllClocks();
        }

        // Update all clocks
        function updateAllClocks() {
            filteredTimezones.forEach((tz, index) => {
                updateClock(tz.timezone, index);
            });
        }

        // Update individual clock
        function updateClock(timezone, index) {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: timezone,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

            const parts = formatter.formatToParts(now);
            const hours = parts.find(p => p.type === 'hour').value;
            const minutes = parts.find(p => p.type === 'minute').value;
            const seconds = parts.find(p => p.type === 'second').value;

            // Digital display
            const timeDisplay = document.getElementById(`time-${index}`);
            if (timeDisplay) {
                timeDisplay.textContent = `${hours}:${minutes}:${seconds}`;
            }

            // Date
            const dateFormatter = new Intl.DateTimeFormat('en-US', {
                timeZone: timezone,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
            const dateParts = dateFormatter.formatToParts(now);
            const month = dateParts.find(p => p.type === 'month').value;
            const day = dateParts.find(p => p.type === 'day').value;
            const year = dateParts.find(p => p.type === 'year').value;

            const dateDisplay = document.getElementById(`date-${index}`);
            if (dateDisplay) {
                dateDisplay.textContent = `${month}/${day}/${year}`;
            }

            // Day
            const dayFormatter = new Intl.DateTimeFormat('en-US', {
                timeZone: timezone,
                weekday: 'long'
            });
            const dayDisplay = document.getElementById(`day-${index}`);
            if (dayDisplay) {
                dayDisplay.textContent = dayFormatter.format(now);
            }

            // Analog clock
            const hourHand = document.getElementById(`hour-${index}`);
            const minuteHand = document.getElementById(`minute-${index}`);
            const secondHand = document.getElementById(`second-${index}`);

            if (hourHand) {
                const hourDegree = (parseInt(hours) % 12) * 30 + parseInt(minutes) * 0.5;
                hourHand.style.transform = `rotate(${hourDegree}deg)`;
            }
            if (minuteHand) {
                const minuteDegree = parseInt(minutes) * 6 + parseInt(seconds) * 0.1;
                minuteHand.style.transform = `rotate(${minuteDegree}deg)`;
            }
            if (secondHand) {
                const secondDegree = parseInt(seconds) * 6;
                secondHand.style.transform = `rotate(${secondDegree}deg)`;
            }
        }

        // Toggle format
        function toggleFormat(format) {
            currentFormat = format;
            document.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            filteredTimezones.forEach((tz, index) => {
                const digitalClock = document.getElementById(`digital-${index}`);
                const analogContainer = document.getElementById(`analog-container-${index}`);

                if (format === 'digital') {
                    digitalClock.style.display = 'block';
                    analogContainer.style.display = 'none';
                } else if (format === 'analog') {
                    digitalClock.style.display = 'none';
                    analogContainer.style.display = 'flex';
                } else if (format === 'both') {
                    digitalClock.style.display = 'block';
                    analogContainer.style.display = 'flex';
                }
            });
        }

        // Search timezone
        function searchTimezone() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            if (searchTerm === '') {
                filteredTimezones = [...timezones];
            } else {
                filteredTimezones = timezones.filter(tz => 
                    tz.name.toLowerCase().includes(searchTerm) ||
                    tz.timezone.toLowerCase().includes(searchTerm)
                );
            }
            renderClocks();
        }

        // Reset search
        function resetSearch() {
            document.getElementById('searchInput').value = '';
            filteredTimezones = [...timezones];
            renderClocks();
        }

        // Update stats
        function updateStats() {
            document.getElementById('totalClocks').textContent = filteredTimezones.length;

            const now = new Date();
            const timeFormatter = new Intl.DateTimeFormat('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
            document.getElementById('timeUpdate').textContent = timeFormatter.format(now);

            document.getElementById('maxDifference').textContent = '+14h/-12h';
            document.getElementById('fastestZone').textContent = 'UTC-12';
        }

        // Keyboard search
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('searchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    searchTimezone();
                }
            });
        });

        // Start the clock
        init();
    </script>
</body>
</html>
